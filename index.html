<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentes de Fútbol</title>
<meta name="description" content="Análisis táctico de fútbol: roles, zonas, presión y transiciones explicados con pizarras y mapas de calor.">
<link rel="icon" href="logo.png">
<style>
  :root { --bg:#0a0618; --texto:#eef2ff; --suave:#b9b6d6; --morado:#b26bff; --azul:#6fe3ff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:radial-gradient(1200px 700px at 20% 0%,#2a0f55 0%,transparent 60%),radial-gradient(1000px 700px at 90% 10%,#062a5c 0%,transparent 60%),var(--bg); color:var(--texto); line-height:1.6; }
  main { max-width:760px; margin:0 auto; padding:56px 16px 40px; text-align:center; }
  img.logo { width:180px; height:180px; border-radius:50%; box-shadow:0 0 60px #7a3cff66,0 0 90px #00a6ff44; }
  h1 { font-size:clamp(2rem,6vw,3rem); margin:24px 0 8px; letter-spacing:.5px; }
  h1 span { background:linear-gradient(90deg,var(--morado),var(--azul)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.lema { color:var(--suave); font-size:1.15rem; margin:0 auto 32px; max-width:560px; }
  .redes { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:40px; }
  .redes a { color:var(--texto); text-decoration:none; padding:12px 20px; border-radius:999px; border:1px solid #ffffff2a; background:#ffffff0d; }
  .redes a:hover { border-color:var(--azul); }
  footer { color:var(--suave); font-size:.9rem; }
  footer a { color:var(--azul); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Logo de Mentes de Fútbol: mitad balón, mitad cerebro">
  <h1>Mentes de <span>Fútbol</span></h1>
  <p class="lema">El fútbol que no te cuentan: análisis táctico de lo que pasa dentro del campo, con pizarras, mapas de calor y debate.</p>
  <div class="redes">
    <a href="https://www.youtube.com/@mentesdefutbol">YouTube</a>
    <a href="https://www.instagram.com/mentesdefutbol/">Instagram</a>
    <a href="https://www.tiktok.com/@mentesdelfutbol21">TikTok</a>
    <a href="https://www.facebook.com/1472360492618284">Facebook</a>
  </div>
  <footer>
    <a href="privacidad.html">Política de privacidad</a> · <a href="condiciones.html">Condiciones del servicio</a>
  </footer>
</main>
</body>
</html>
